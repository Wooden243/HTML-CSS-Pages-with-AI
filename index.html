
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabita - 毎日のタスクを、もっと軽く</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50 text-gray-800">

    <!-- セクション1：ヒーロー -->
    <header class="text-center py-12 px-4">
        <h1 class="text-3xl font-bold mb-4">
            毎日のタスクを、もっと軽く
        </h1>

        <p class="mb-4">
            Tabitaはチームと個人のタスクを1つにまとめる、シンプルなタスク管理ツールです。
        </p>

        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            無料で始める
        </button>

        <button class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded">
            機能を見る
        </button>
    </header>

    <!-- セクション2：機能 -->
    <section class="mt-8 px-4 max-w-5xl mx-auto">
        <h2 class="text-2xl font-bold mb-4 text-center">
            主な機能
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

            <div class="bg-white p-4 rounded border">
                <h3 class="font-bold mb-2">簡単追加</h3>
                <p>ワンクリックでタスクを作成でき、面倒な入力は要りません。</p>
            </div>

            <div class="bg-white p-4 rounded border">
                <h3 class="font-bold mb-2">チーム共有</h3>
                <p>メンバー間で進捗をリアルタイムに見える化します。</p>
            </div>

            <div class="bg-white p-4 rounded border">
                <h3 class="font-bold mb-2">通知連携</h3>
                <p>Slack やメールに重要なタスクを自動で通知します。</p>
            </div>

        </div>
    </section>

</body>
</html>
